# Source-ownership registry (REBUILD_DESIGN §4).
# Every table has exactly ONE owner. The loader framework refuses to let a
# loader write a table that is not registered to it.
# `weekly = true` puts the owner in `fdb weekly`; order = run order.

[[table]]
name = "teams"
owner = "schema"
note = "reference data seeded in schema/002_teams.sql"

[[table]]
name = "team_aliases"
owner = "schema"
note = "every source spelling -> franchise"

[[table]]
name = "core_schedule"
owner = "nflverse.schedules"
source = "nflverse release schedules/games.csv"
grain = "game"
seasons = "2016-"
weekly = true

[[table]]
name = "core_nflverse_players"
owner = "nflverse.players"
source = "nflverse release players/players.csv"
grain = "person"
weekly = true

[[table]]
name = "core_rosters_weekly"
owner = "nflverse.rosters_weekly"
source = "nflverse release weekly_rosters/roster_weekly_<season>.csv"
grain = "player-week"
seasons = "2016-"
weekly = true

[[table]]
name = "core_dp_playerids"
owner = "dynastyprocess.playerids"
source = "raw.githubusercontent.com/dynastyprocess/data/master/files/db_playerids.csv"
grain = "person"
weekly = true

[[table]]
name = "core_player_stats"
owner = "nflverse.player_stats"
source = "stats_player/stats_player_week_<season>.csv"
grain = "week"
weekly = true

[[table]]
name = "core_snap_counts"
owner = "nflverse.snap_counts"
source = "snap_counts/snap_counts_<season>.csv"
grain = "week"
weekly = true

[[table]]
name = "core_pbp"
owner = "nflverse.pbp"
source = "pbp/play_by_play_<season>.csv.gz (121 columns; list = contracts/nflverse.pbp.fields)"
grain = "week"
weekly = true

[[table]]
name = "core_participation"
owner = "nflverse.participation"
source = "pbp_participation/pbp_participation_<season>.csv (2016-2025)"
grain = "week"
weekly = true

[[table]]
name = "core_ngs_passing"
owner = "nflverse.ngs_passing"
source = "nextgen_stats/ngs_passing.csv.gz"
grain = "week"
weekly = true

[[table]]
name = "core_ngs_receiving"
owner = "nflverse.ngs_receiving"
source = "nextgen_stats/ngs_receiving.csv.gz"
grain = "week"
weekly = true

[[table]]
name = "core_ngs_rushing"
owner = "nflverse.ngs_rushing"
source = "nextgen_stats/ngs_rushing.csv.gz"
grain = "week"
weekly = true

[[table]]
name = "core_nflverse_ftn_charting"
owner = "nflverse.ftn_charting"
source = "ftn_charting/ftn_charting_<season>.csv (nflverse's FTN mirror, 2022-)"
grain = "week"
seasons = "2022-"
weekly = true

[[table]]
name = "core_ff_opportunity"
owner = "ffverse.ff_opportunity"
source = "ffverse/ffopportunity latest-data/ep_weekly_<season>.csv"
grain = "week"
weekly = true

# --- Phase 3: fantasy platforms. Leagues/seasons in scope: config/my_franchises.toml.
# mfl.league fetches TYPE=league once; divisions/conferences/franchises read that raw file.
[[table]]
name = "core_mfl_league"
owner = "mfl.league"
source = "MFL export TYPE=league (scalar settings)"
grain = "league"
weekly = true

[[table]]
name = "core_mfl_divisions"
owner = "mfl.divisions"
source = "MFL TYPE=league divisions.division (reads mfl.league's raw)"
grain = "league"
weekly = true

[[table]]
name = "core_mfl_conferences"
owner = "mfl.conferences"
source = "MFL TYPE=league conferences.conference (reads mfl.league's raw)"
grain = "league"
weekly = true

[[table]]
name = "core_mfl_franchises"
owner = "mfl.franchises"
source = "MFL TYPE=league franchises.franchise (reads mfl.league's raw); contact fields not stored"
grain = "league"
weekly = true

[[table]]
name = "core_mfl_rules"
owner = "mfl.rules"
source = "MFL export TYPE=rules, flattened, verbatim"
grain = "league"
weekly = true

[[table]]
name = "core_mfl_players"
owner = "mfl.players"
source = "MFL export TYPE=players&DETAILS=1, league-scoped"
grain = "league"
weekly = true

[[table]]
name = "core_mfl_rosters"
owner = "mfl.rosters"
source = "MFL export TYPE=rosters; one snapshot per UTC day kept"
grain = "league_snapshot"
weekly = true

[[table]]
name = "core_mfl_player_scores"
owner = "mfl.player_scores"
source = "MFL export TYPE=playerScores&W=<week> (reported points)"
grain = "league_week"
weekly = true

[[table]]
name = "core_sleeper_league"
owner = "sleeper.league"
source = "api.sleeper.app/v1/league/<id>"
grain = "league"
weekly = true

[[table]]
name = "core_sleeper_users"
owner = "sleeper.users"
source = "api.sleeper.app/v1/league/<id>/users"
grain = "league"
weekly = true

[[table]]
name = "core_sleeper_rosters"
owner = "sleeper.rosters"
source = "api.sleeper.app/v1/league/<id>/rosters; one snapshot per UTC day kept"
grain = "league_snapshot"
weekly = true

[[table]]
name = "core_sleeper_players"
owner = "sleeper.players"
source = "api.sleeper.app/v1/players/nfl (~15 MB)"
grain = "snapshot"
weekly = true

# --- Phase 4: PFF Developer API (api.pff.com, Bearer PFF_API_KEY). Weekly facets are
# requested per (season, week) with PFF's week numbers (POST = 28/29/30/32). Grades use
# the server-aggregated week-list call; the bare season call includes PRESEASON.

[[table]]
name = "core_pff_defense_week"
owner = "pff.defense_week"
source = "PFF facet/defense/summary week=N"
grain = "week"
seasons = "2016-"
weekly = true

[[table]]
name = "core_pff_pass_rush_week"
owner = "pff.pass_rush_week"
source = "PFF facet/defense/pass_rush week=N"
grain = "week"
seasons = "2016-"
weekly = true
note = "pass-rush wins/opportunities for the §6.1 expected-sacks model"

[[table]]
name = "core_pff_fg_week"
owner = "pff.fg_week"
source = "PFF facet/field_goal/summary week=N"
grain = "week"
seasons = "2016-"
weekly = true

[[table]]
name = "core_pff_passing_week"
owner = "pff.passing_week"
source = "PFF facet/passing/summary week=N"
grain = "week"
seasons = "2016-"
weekly = true

[[table]]
name = "core_pff_rushing_week"
owner = "pff.rushing_week"
source = "PFF facet/rushing/summary week=N"
grain = "week"
seasons = "2016-"
weekly = true

[[table]]
name = "core_pff_receiving_week"
owner = "pff.receiving_week"
source = "PFF facet/receiving/summary week=N"
grain = "week"
seasons = "2016-"
weekly = true

[[table]]
name = "core_pff_blocking_week"
owner = "pff.blocking_week"
source = "PFF facet/offense/blocking week=N"
grain = "week"
seasons = "2016-"
weekly = true

[[table]]
name = "core_pff_coverage_scheme_week"
owner = "pff.coverage_scheme_week"
source = "PFF facet/defense/coverage_scheme week=N"
grain = "week"
seasons = "2016-"
weekly = true

[[table]]
name = "core_pff_offense_season"
owner = "pff.offense_season"
source = "PFF facet/offense/summary week=<REG weeks>,28,29,30,32"
grain = "season"
seasons = "2016-"
weekly = true

[[table]]
name = "core_pff_defense_season"
owner = "pff.defense_season"
source = "PFF facet/defense/summary week=<REG weeks>,28,29,30,32"
grain = "season"
seasons = "2016-"
weekly = true

# --- Phase 5: FTN Data (data.ftndata.com, Authorization: FTN_API_KEY). FTN ids are gsis_ids.
# Rows are placed by FTN game (gid) through core_ftn_games. The nflverse/FTN participation
# seam is mart_participation_personnel (builder participation.seam), not a shared table.
[[table]]
name = "core_ftn_games"
owner = "ftn.games"
source = "FTN /games/{season}"
grain = "season"
seasons = "2020-"
weekly = true

[[table]]
name = "core_ftn_plays"
owner = "ftn.plays"
source = "FTN /games/{season}/plays (paginated, page cap 1000)"
grain = "week"
seasons = "2021-"
weekly = true

[[table]]
name = "core_ftn_participation"
owner = "ftn.participation"
source = "FTN /games/{season}/participation"
grain = "week"
seasons = "2021-"
weekly = true

[[table]]
name = "core_ftn_all22"
owner = "ftn.all22"
source = "FTN /all22/game/{gid}, one call per game"
grain = "week"
seasons = "2026-"
weekly = true

