# Source-ownership registry (REBUILD_DESIGN §4).
# Every table has exactly ONE owner. The loader framework refuses to let a
# loader write a table that is not registered to it.
# `weekly = true` puts the owner in `fdb weekly`; order = run order.

[[table]]
name = "teams"
owner = "schema"
note = "reference data seeded in schema/002_teams.sql"

[[table]]
name = "team_aliases"
owner = "schema"
note = "every source spelling -> franchise"

[[table]]
name = "core_schedule"
owner = "nflverse.schedules"
source = "nflverse release schedules/games.csv"
grain = "game"
seasons = "2016-"
weekly = true

[[table]]
name = "core_nflverse_players"
owner = "nflverse.players"
source = "nflverse release players/players.csv"
grain = "person"
weekly = true

[[table]]
name = "core_rosters_weekly"
owner = "nflverse.rosters_weekly"
source = "nflverse release weekly_rosters/roster_weekly_<season>.csv"
grain = "player-week"
seasons = "2016-"
weekly = true

[[table]]
name = "core_dp_playerids"
owner = "dynastyprocess.playerids"
source = "raw.githubusercontent.com/dynastyprocess/data/master/files/db_playerids.csv"
grain = "person"
weekly = true

[[table]]
name = "core_player_stats"
owner = "nflverse.player_stats"
source = "stats_player/stats_player_week_<season>.csv"
grain = "week"
weekly = true

[[table]]
name = "core_snap_counts"
owner = "nflverse.snap_counts"
source = "snap_counts/snap_counts_<season>.csv"
grain = "week"
weekly = true

[[table]]
name = "core_pbp"
owner = "nflverse.pbp"
source = "pbp/play_by_play_<season>.csv.gz (117 columns)"
grain = "week"
weekly = true

[[table]]
name = "core_participation"
owner = "nflverse.participation"
source = "pbp_participation/pbp_participation_<season>.csv (2016-2025)"
grain = "week"
weekly = true

[[table]]
name = "core_ngs_passing"
owner = "nflverse.ngs_passing"
source = "nextgen_stats/ngs_passing.csv.gz"
grain = "week"
weekly = true

[[table]]
name = "core_ngs_receiving"
owner = "nflverse.ngs_receiving"
source = "nextgen_stats/ngs_receiving.csv.gz"
grain = "week"
weekly = true

[[table]]
name = "core_ngs_rushing"
owner = "nflverse.ngs_rushing"
source = "nextgen_stats/ngs_rushing.csv.gz"
grain = "week"
weekly = true

[[table]]
name = "core_ff_opportunity"
owner = "ffverse.ff_opportunity"
source = "ffverse/ffopportunity latest-data/ep_weekly_<season>.csv"
grain = "week"
weekly = true

# Builders run after every loader, in this order, in rebuild and weekly.
[[table]]
name = "players"
owner = "identity.build"
kind = "builder"

[[table]]
name = "player_ids"
owner = "identity.build"
kind = "builder"

[[table]]
name = "identity_quarantine"
owner = "identity.build"
kind = "builder"
