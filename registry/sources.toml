# Source-ownership registry (REBUILD_DESIGN §4).
# Every table has exactly ONE owner. The loader framework refuses to let a
# loader write a table that is not registered to it.
# `weekly = true` puts the owner in `fdb weekly`; order = run order.

[[table]]
name = "teams"
owner = "schema"
note = "reference data seeded in schema/002_teams.sql"

[[table]]
name = "team_aliases"
owner = "schema"
note = "every source spelling -> franchise"

[[table]]
name = "core_schedule"
owner = "nflverse.schedules"
source = "nflverse release schedules/games.csv"
grain = "game"
seasons = "2016-"
weekly = true

[[table]]
name = "core_nflverse_players"
owner = "nflverse.players"
source = "nflverse release players/players.csv"
grain = "person"
weekly = true

[[table]]
name = "core_rosters_weekly"
owner = "nflverse.rosters_weekly"
source = "nflverse release weekly_rosters/roster_weekly_<season>.csv"
grain = "player-week"
seasons = "2016-"
weekly = true

[[table]]
name = "core_dp_playerids"
owner = "dynastyprocess.playerids"
source = "raw.githubusercontent.com/dynastyprocess/data/master/files/db_playerids.csv"
grain = "person"
weekly = true

[[table]]
name = "core_player_stats"
owner = "nflverse.player_stats"
source = "stats_player/stats_player_week_<season>.csv"
grain = "week"
weekly = true

[[table]]
name = "core_snap_counts"
owner = "nflverse.snap_counts"
source = "snap_counts/snap_counts_<season>.csv"
grain = "week"
weekly = true

[[table]]
name = "core_pbp"
owner = "nflverse.pbp"
source = "pbp/play_by_play_<season>.csv.gz (117 columns)"
grain = "week"
weekly = true

[[table]]
name = "core_participation"
owner = "nflverse.participation"
source = "pbp_participation/pbp_participation_<season>.csv (2016-2025)"
grain = "week"
weekly = true

[[table]]
name = "core_ngs_passing"
owner = "nflverse.ngs_passing"
source = "nextgen_stats/ngs_passing.csv.gz"
grain = "week"
weekly = true

[[table]]
name = "core_ngs_receiving"
owner = "nflverse.ngs_receiving"
source = "nextgen_stats/ngs_receiving.csv.gz"
grain = "week"
weekly = true

[[table]]
name = "core_ngs_rushing"
owner = "nflverse.ngs_rushing"
source = "nextgen_stats/ngs_rushing.csv.gz"
grain = "week"
weekly = true

[[table]]
name = "core_ff_opportunity"
owner = "ffverse.ff_opportunity"
source = "ffverse/ffopportunity latest-data/ep_weekly_<season>.csv"
grain = "week"
weekly = true

# --- Phase 3: fantasy platforms. Leagues/seasons in scope: config/my_franchises.toml.
# mfl.league fetches TYPE=league once; divisions/conferences/franchises read that raw file.
[[table]]
name = "core_mfl_league"
owner = "mfl.league"
source = "MFL export TYPE=league (scalar settings)"
grain = "league"
weekly = true

[[table]]
name = "core_mfl_divisions"
owner = "mfl.divisions"
source = "MFL TYPE=league divisions.division (reads mfl.league's raw)"
grain = "league"
weekly = true

[[table]]
name = "core_mfl_conferences"
owner = "mfl.conferences"
source = "MFL TYPE=league conferences.conference (reads mfl.league's raw)"
grain = "league"
weekly = true

[[table]]
name = "core_mfl_franchises"
owner = "mfl.franchises"
source = "MFL TYPE=league franchises.franchise (reads mfl.league's raw); contact fields not stored"
grain = "league"
weekly = true

[[table]]
name = "core_mfl_rules"
owner = "mfl.rules"
source = "MFL export TYPE=rules, flattened, verbatim"
grain = "league"
weekly = true

[[table]]
name = "core_mfl_players"
owner = "mfl.players"
source = "MFL export TYPE=players&DETAILS=1, league-scoped"
grain = "league"
weekly = true

[[table]]
name = "core_mfl_rosters"
owner = "mfl.rosters"
source = "MFL export TYPE=rosters; one snapshot per UTC day kept"
grain = "league_snapshot"
weekly = true

[[table]]
name = "core_mfl_player_scores"
owner = "mfl.player_scores"
source = "MFL export TYPE=playerScores&W=<week> (reported points)"
grain = "league_week"
weekly = true

[[table]]
name = "core_sleeper_league"
owner = "sleeper.league"
source = "api.sleeper.app/v1/league/<id>"
grain = "league"
weekly = true

[[table]]
name = "core_sleeper_users"
owner = "sleeper.users"
source = "api.sleeper.app/v1/league/<id>/users"
grain = "league"
weekly = true

[[table]]
name = "core_sleeper_rosters"
owner = "sleeper.rosters"
source = "api.sleeper.app/v1/league/<id>/rosters; one snapshot per UTC day kept"
grain = "league_snapshot"
weekly = true

[[table]]
name = "core_sleeper_players"
owner = "sleeper.players"
source = "api.sleeper.app/v1/players/nfl (~15 MB)"
grain = "snapshot"
weekly = true

# Builders run after every loader, in this order, in rebuild and weekly.
[[table]]
name = "players"
owner = "identity.build"
kind = "builder"

[[table]]
name = "player_ids"
owner = "identity.build"
kind = "builder"

[[table]]
name = "identity_quarantine"
owner = "identity.build"
kind = "builder"

[[table]]
name = "my_franchises"
owner = "fantasy.config"
kind = "builder"
note = "config/my_franchises.toml as a table; also reports unresolved roster slots"

# User-entered state: written only by the app (app/ownership.py). Exported to
# app_state/*.csv and re-imported by `fdb rebuild`.
[[table]]
name = "app_wishlist"
owner = "app.ownership"
kind = "app"

[[table]]
name = "app_wishlist_priority"
owner = "app.ownership"
kind = "app"
