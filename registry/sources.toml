# DD Fantasy Football Trinity (fdb/ddff.py; member login in .env). 2021+, REG weeks 1-17: where the site's pickers start/stop.
[[table]]
name = "core_trinity_ftn_aggregates"
owner = "ddff.trinity_aggregates"
source = "ddfantasyfootball.com RPC trinity_ftn_aggregates_weeks, one week per call"
grain = "week"
seasons = "2021-"
weekly = true
note = "the weekly FTN counts DD's page computes Trinity from; sleeper_id + gsis id on every row"

[[table]]
name = "core_trinity_scores"
owner = "ddff.trinity_scores"
source = "ddfantasyfootball.com RPC gated_trinity_scores"
grain = "season"
seasons = "2021-"
weekly = true
note = "DD's stored season score, closed seasons only (the live season is computed in mart_trinity_*)"

[[table]]
name = "mart_trinity_week"
owner = "trinity.build"
kind = "builder"
note = "Trinity Score per player-week, DD's page formula ported (fdb/trinity.py); derived, not a source field"

[[table]]
name = "mart_trinity_through_week"
owner = "trinity.build"
kind = "builder"
note = "the same score over weeks 1..week (season to date)"

[[table]]
name = "my_franchises"
owner = "fantasy.config"
kind = "builder"
note = "config/my_franchises.toml as a table; also reports unresolved roster slots"

# User-entered state: written only by the app (app/ownership.py). Exported to
# app_state/*.csv and re-imported by `fdb rebuild`.
[[table]]
name = "app_wishlist"
owner = "app.ownership"
kind = "app"

[[table]]
name = "app_wishlist_priority"
owner = "app.ownership"
kind = "app"

# FTN Fantasy StatsHub (fdb/ftnfantasy.py; website login FTN_USER/FTN_PASS in .env). Not the FTN Data API: that has no DVOA.
[[table]]
name = "core_ftn_dvoa_team_week"
owner = "ftnfantasy.dvoa_team"
source = "ftnfantasy.com StatsHub POST /dvoa/team, one week per call"
grain = "week"
seasons = "2018-"
weekly = true
note = "single-week offense/defense/total DVOA per team that played; defDvoa lower is better; mart_team_dvoa_week renames"
