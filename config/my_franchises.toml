# Who am I in each league (REBUILD_DESIGN §4: replaces v1 gameday_config.json's
# my_entry_id). Checked in; nothing secret here.
#
# `seasons` = the seasons v2 loads for that league. MFL league ids persist across
# years; Sleeper rolls a dynasty league to a NEW id every season (previous_league_id),
# so a Sleeper entry names one season's id.
# `my_franchise` = MFL franchise id / Sleeper roster_id, as the source writes it.
# Legacy leagues 19161 and 21991 are deliberately absent.

[[league]]
platform = "mfl"
league_id = "30590"
name = "TINO NFL Elite"
my_franchise = "0021"
seasons = [2025, 2026]
