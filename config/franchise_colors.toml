# Franchise colors for the Matchup of the Week card, keyed by franchise id PER LEAGUE (never by name at read time).
# `color` is the franchise's accent on the card's dark background; `alt` is used for the second team when two primaries
# are too close (Bengals / Broncos / Browns oranges; Ravens purple vs Vikings purple). v1's name lookup had colors too
# dark for a dark card (Ravens #241773) and several near-duplicates; these are brightened. League 30590 only: its 32
# franchises are named after NFL clubs. A franchise without an entry gets no color and the renderer falls back.
# The trailing comment is the club abbreviation, for the human reading this file.

[[color]]
league_id = "30590"
franchise_id = "0001"
color = "#E03A4F"
alt = "#9AA0A6"   # ATL

